name: Renew PythonAnywhere Webapp

on:
  schedule:
    # Roda a cada 25 dias às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 */25 * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv playwright
        playwright install chromium --with-deps

    - name: Run renewal script
      env:
        PYTHONANYWHERE_USER: ${{ secrets.PYTHONANYWHERE_USER }}
        PYTHONANYWHERE_PASS: ${{ secrets.PYTHONANYWHERE_PASS }}
      run: python cron_jobs/renew_pythonanywhere.py

    - name: Publish Step Summary
      if: always()
      run: |
        if [ -f renew_result.txt ]; then
          echo "### 🚀 Status da Renovação" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat renew_result.txt >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Falha Crítica" >> $GITHUB_STEP_SUMMARY
          echo "O script não gerou o arquivo de resultados." >> $GITHUB_STEP_SUMMARY
        fi

