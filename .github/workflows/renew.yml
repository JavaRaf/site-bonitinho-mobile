name: Renew PythonAnywhere Webapp

on:
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv playwright
        playwright install chromium --with-deps

    - name: Run renewal script
      env:
        PYTHONANYWHERE_USER: ${{ secrets.PYTHONANYWHERE_USER }}
        PYTHONANYWHERE_PASS: ${{ secrets.PYTHONANYWHERE_PASS }}
      run: python cron_jobs/renew_pythonanywhere.py

    - name: Upload screenshot if failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshot
        path: failure.png
