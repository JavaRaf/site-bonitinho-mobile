<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/svg/logo.svg">
  <title>Site Bonitinho</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>

<body>
  <header>
    <div class="logo">
      <div id="logo-img"><img src="/static/svg/logo.svg" type="image/png"></div>
      <div id="logo-name">ArteBonitinha</div>
    </div>

    <div class="user">
      <button class="view-toggle" id="viewToggle" type="button" title="Alternar visualização" aria-label="Alternar visualização"></button>
      <div id="user-avatar"><img src="/static/svg/default-avatar.svg" type="image/svg"></div>
      <div class="user-menu" id="userMenu">
        <button class="menu-item" id="menuPerfil">Perfil</button>
        <button class="menu-item" id="menuVotos">Votos</button>
        <button class="menu-item" id="menuUpload">Criar post</button>
        <button class="menu-item" id="menuDarkToggle">Alternar tema</button>
        <button class="menu-item" id="menuAdmin">Admin</button>
        <button class="menu-item" id="menuLogout">Sair</button>
      </div>
    </div>
  </header>

  <div class="feed-create" id="feedCreate" hidden>
    <div class="feed-create-inner">
      <img class="feed-create-avatar" id="feedCreateAvatar" src="/static/svg/default-avatar.svg" alt="">
      <input type="text" class="feed-create-input" id="feedCreateText" placeholder="No que você está pensando?" autocomplete="off">
      <input type="file" id="feedCreateFile" accept="image/*" hidden>
      <button class="feed-create-icon" id="feedCreateImg" type="button" title="Imagem">
        <img src="/static/svg/image.svg" alt="">
      </button>
      <button class="feed-create-send" id="feedCreateSend" type="button" title="Publicar" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5003 12H5.41872M5.24634 12.7972L4.24158 15.7986C3.69128 17.4424 3.41613 18.2643 3.61359 18.7704C3.78506 19.21 4.15335 19.5432 4.6078 19.6701C5.13111 19.8161 5.92151 19.4604 7.50231 18.7491L17.6367 14.1886C19.1797 13.4942 19.9512 13.1471 20.1896 12.6648C20.3968 12.2458 20.3968 11.7541 20.1896 11.3351C19.9512 10.8529 19.1797 10.5057 17.6367 9.81135L7.48483 5.24303C5.90879 4.53382 5.12078 4.17921 4.59799 4.32468C4.14397 4.45101 3.77572 4.78336 3.60365 5.22209C3.40551 5.72728 3.67772 6.54741 4.22215 8.18767L5.24829 11.2793C5.34179 11.561 5.38855 11.7019 5.407 11.8459C5.42338 11.9738 5.42321 12.1032 5.40651 12.231C5.38768 12.375 5.34057 12.5157 5.24634 12.7972Z"/></svg>
      </button>
    </div>
    <div class="feed-create-preview" id="feedCreatePreview" hidden>
      <img id="feedCreatePreviewImg" src="" alt="">
      <button type="button" class="feed-create-nsfw" id="feedCreateNsfw" title="Conteúdo +18">18+</button>
      <button type="button" class="feed-create-preview-remove" id="feedCreatePreviewRemove">&times;</button>
    </div>
  </div>

  <div class="composer-overlay" id="composerModal">
    <div class="composer-card">
      <div class="composer-header">
        <h2>Criar post</h2>
        <button class="composer-close" id="composerClose" type="button" aria-label="Fechar">&times;</button>
      </div>
      <div class="composer-preview composer-zip-preview" id="composerZipPreview" hidden>
        <span id="composerZipLabel">Arquivo ZIP selecionado</span>
        <button class="composer-remove" id="composerZipRemove" type="button"
          aria-label="Remover arquivo">&times;</button>
      </div>
      <div class="composer-preview" id="composerPreview" hidden>
        <img id="composerPreviewImg" alt="">
        <button type="button" class="feed-create-nsfw" id="composerNsfw" title="Conteúdo +18">18+</button>
        <button class="composer-remove" id="composerRemove" type="button" aria-label="Remover imagem">&times;</button>
      </div>
      <textarea class="composer-text" id="composerText" placeholder="No que você está pensando?" rows="3"
        maxlength="250"></textarea>
      <div class="composer-actions">
        <input type="file" id="composerImageInput" accept="image/*" hidden>
        <input type="file" id="composerZipInput" accept=".zip,application/zip" hidden>
        <button class="composer-add" id="composerAddZip" type="button" title="Enviar ZIP" aria-label="Enviar ZIP">
          <img src="/static/svg/zip.svg" alt="" width="18" height="18">
        </button>

        <button class="composer-add" id="composerAddImage" type="button" title="Adicionar imagem"
          aria-label="Adicionar imagem">
          <img src="/static/svg/image.svg" alt="" width="18" height="18">
        </button>
        <button class="composer-post" id="composerPost" type="button" disabled title="Publicar" aria-label="Publicar">
          <span>Publicar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="carrossel">
    <button class="carousel-arrow carousel-prev" id="carouselPrev" aria-label="Anterior">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
    <div class="img-model">

      <div class="img-owner" id="imgOwner"><img id="imgOwnerAvatar" class="img-owner-avatar"
          src="/static/svg/default-avatar.svg" alt=""><span id="imgOwnerName"></span><span class="img-owner-singlevote"
          id="imgOwnerSingleVote" style="display:none">Voto único</span>
        <select class="sort-select" id="sortSelect" title="Ordenar" aria-label="Ordenar">
          <option value="likes">Mais votadas</option>
          <option value="recent">Mais recentes</option>
        </select>
      </div>

      <div class="img-caption" id="imgCaption"></div>

      <div id="img-view">
        <div class="carousel-track" id="carouselTrack">
          <img src="/static/svg/image-placeholder.svg" alt="" class="img-placeholder">
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>

      <div class="buttons">
        <div class="btn-group">
          <div id="likes-btn"><img src="/static/svg/upvote.svg" alt="like"></div>
          <span class="likes-count" id="likes-count"></span>
        </div>
        <div class="btn-group">
          <div id="comment-btn"><img src="/static/svg/comments.svg" alt="comment"></div>
          <span class="likes-count" id="comment-count"></span>
        </div>
        <div id="download-btn"><img src="/static/svg/download.svg" alt="download"></div>
        <div id="grid-btn"><img src="/static/svg/grid.svg" alt="grid"></div>
      </div>

      <div class="likers-section" id="likersSection" hidden>
        <div class="likers-header">
          <span class="likers-title">Curtido por</span>
          <button class="likers-close" id="likersClose" type="button" aria-label="Fechar">&times;</button>
        </div>
        <div class="likers-list" id="likersList"></div>
      </div>

      <div class="comments-section" id="commentsSection">
        <div class="comments-list" id="commentsList"></div>
        <form class="comment-form" id="commentForm">
          <input type="text" placeholder="Adicione um comentário..." id="commentInput" autocomplete="off">
          <button type="submit">Enviar</button>
        </form>
      </div>


    </div>
    <button class="carousel-arrow carousel-next" id="carouselNext" aria-label="Próximo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>

  <div class="grid-overlay" id="gridOverlay">
    <div class="grid-panel">
      <div class="grid-header">
        <span class="grid-title">Galeria</span>
        <button class="grid-close" id="gridClose" type="button" aria-label="Fechar">&times;</button>
      </div>
      <div class="grid-thumbs" id="gridThumbs"></div>
    </div>
  </div>

  <div class="feed-sort-wrap" id="feedSortWrap" hidden>
    <select class="sort-select" id="feedSortSelect" title="Ordenar" aria-label="Ordenar">
      <option value="likes">Mais votadas</option>
      <option value="recent">Mais recentes</option>
    </select>
  </div>

  <div class="feed-view" id="feedView" hidden></div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-header">
      <div class="lightbox-info">
        <img class="lightbox-avatar" id="lightboxAvatar" src="/static/svg/default-avatar.svg" alt="">
        <span class="lightbox-owner" id="lightboxOwner"></span>
        <span class="lightbox-likes" id="lightboxLikes"></span>
      </div>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fechar">&times;</button>
    </div>
    <div class="lightbox-body" id="lightboxBody">
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Anterior">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="lightbox-img-wrap" id="lightboxImgWrap">
        <img class="lightbox-img" id="lightboxImg" src="" alt="">
      </div>
      <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Próximo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

</body>

<script src="/static/js/carousel.js"></script>
<script src="/static/js/download.js"></script>
<script src="/static/js/comments.js"></script>
<script src="/static/js/user-menu.js"></script>
<script src="/static/js/composer.js"></script>
<script src="/static/js/lightbox.js"></script>

</html>
