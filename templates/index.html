<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Bonitinho</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
  <header>
    <div class="logo">
      <div id="logo-img"><img src="/static/img/logo.png" type="image/png"></div>
      <div id="logo-name">ArteBonitinha</div>
    </div>

    <div class="user">
      <div id="user-avatar"><img src="/static/img/default-avatar.svg" type="image/png"></div>
      <div class="user-menu" id="userMenu">
        <button class="menu-item" id="menuPerfil">Perfil</button>
        <button class="menu-item" id="menuVotos">Votos</button>
        <button class="menu-item" id="menuUpload">Upload</button>
        <button class="menu-item" id="menuAdmin">Admin</button>
        <button class="menu-item" id="menuLogout">Sair</button>
      </div>
      <input type="file" id="uploadInput" name="images" accept="image/*" multiple hidden>
    </div>
  </header>

    <div class="carrossel">
      <div class="img-model">

        <div id="img-view">
          <div class="img-owner" id="imgOwner"></div>
          <div class="carousel-track" id="carouselTrack">
            <svg class="img-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
          </div>
          <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <div class="buttons">
          <div class="btn-group">
            <div id="likes-btn"><img src="/static/img/heart.svg" alt="like"></div>
            <span class="likes-count" id="likes-count"></span>
          </div>
          <div id="comment-btn"><img src="/static/img/comments.svg" alt="comment"></div>
          <div id="download-btn"><img src="/static/img/download.svg" alt="download"></div>
        </div>

        <div class="comments-section" id="commentsSection">
          <div class="comments-list" id="commentsList"></div>
          <form class="comment-form" id="commentForm">
            <input type="text" placeholder="Adicione um comentário..." id="commentInput" autocomplete="off">
            <button type="submit">Enviar</button>
          </form>
        </div>
        

      </div>
    </div>

</body>

<script src="/static/js/carousel.js"></script>
<script src="/static/js/download.js"></script>
<script src="/static/js/comments.js"></script>
<script src="/static/js/user-menu.js"></script>

</html>
