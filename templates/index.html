<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#FA8128">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MikanNet">
  <link rel="apple-touch-icon" href="/static/png/logo-128x128.png">
  <link rel="icon" href="/static/png/logo-128x128.png">
  <title>MikanNet</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>

<body>
  <header>
    <div class="logo">
      <div id="logo-img"><img src="/static/png/logo-128x128.png" type="image/png"></div>
      <div id="logo-name">MikanNet</div>
    </div>

    <div class="user">
      <button class="header-grid-btn" id="grid-btn" type="button" title="Galeria" aria-label="Galeria"><img src="/static/svg/grid.svg" alt="grid"></button>
      <button class="header-bell" id="headerBell" type="button" title="Notificações" aria-label="Notificações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="header-bell-badge" id="bellBadge" hidden>0</span>
      </button>
      <div id="user-avatar"><img src="/static/svg/default-avatar.svg" type="image/svg"></div>
      <div class="user-menu" id="userMenu">
        <button class="menu-item" id="menuPerfil">Perfil</button>
        <button class="menu-item" id="menuEleicao">Eleição/votos</button>
        <button class="menu-item" id="menuDarkToggle">Alternar tema</button>
        <button class="menu-item" id="menuAdmin">Admin</button>
        <button class="menu-item" id="menuLogout">Sair</button>
      </div>
      <div class="notif-panel" id="notifPanel" hidden>
        <div class="notif-header">
          <span class="notif-title">Notificações</span>
          <button class="notif-push-toggle" id="notifPushToggle" type="button" title="Ativar/desativar notificações">
            <svg class="notif-bell-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
        </div>
        <div class="notif-list" id="notifList">
          <p class="notif-empty">Nenhuma notificação</p>
        </div>
      </div>
    </div>
  </header>

  <div class="header-sections" id="headerSections">
    <div class="header-section active" id="headerSection1">
      <span class="header-section-label">Para você</span>
      <div class="header-section-sort" id="paraVoceSort">
        <button class="header-section-arrow" id="paraVoceSortBtn" type="button" title="Ordenar" aria-label="Ordenar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="header-sort-menu" id="paraVoceSortMenu" hidden>
          <button type="button" data-sort="popular">Popular</button>
          <button type="button" data-sort="recente">Recente</button>
        </div>
      </div>
    </div>
    <div class="header-section" id="headerSection2">
      <span class="header-section-label">Seguindo</span>
      <div class="header-section-sort" id="seguindoSort">
        <button class="header-section-arrow" id="seguindoSortBtn" type="button" title="Ordenar" aria-label="Ordenar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="header-sort-menu" id="seguindoSortMenu" hidden>
          <button type="button" data-sort="popular">Popular</button>
          <button type="button" data-sort="recente">Recente</button>
        </div>
      </div>
    </div>
    <div class="header-section" id="headerSection3">
      <span class="header-section-label">Eleição</span>
      <span class="single-vote-badge" id="singleVoteBadge" hidden>Voto único</span>
      <div class="header-section-sort" id="eleicaoSort">
        <button class="header-section-arrow" id="eleicaoSortBtn" type="button" title="Ordenar" aria-label="Ordenar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="header-sort-menu" id="eleicaoSortMenu" hidden>
          <button type="button" data-sort="popular">Popular</button>
          <button type="button" data-sort="recente">Recente</button>
        </div>
      </div>
    </div>
  </div>

  <div class="composer-overlay" id="composerModal">
    <div class="composer-card">
      <div class="composer-header">
        <h2>Criar post</h2>
        <button class="composer-close" id="composerClose" type="button" aria-label="Fechar">&times;</button>
      </div>
      <div class="composer-preview composer-zip-preview" id="composerZipPreview" hidden>
        <span id="composerZipLabel">Arquivo ZIP selecionado</span>
        <button class="composer-remove" id="composerZipRemove" type="button"
          aria-label="Remover arquivo">&times;</button>
      </div>
      <div class="composer-media-previews" id="composerMediaPreviews"></div>
      <textarea class="composer-text" id="composerText" placeholder="No que voce esta pensando?" rows="3"
        maxlength="400"></textarea>
      <div class="composer-actions">
        <input type="file" id="composerImageInput" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>
        <input type="file" id="composerZipInput" accept=".zip,application/zip" hidden>
        <button class="composer-add" id="composerAddZip" type="button" title="Enviar ZIP" aria-label="Enviar ZIP">
          <img src="/static/svg/zip.svg" alt="" width="18" height="18">
        </button>

        <button class="composer-add" id="composerAddImage" type="button" title="Adicionar mídia"
          aria-label="Adicionar midia">
          <img src="/static/svg/image.svg" alt="" width="18" height="18">
        </button>
        <button class="composer-post" id="composerPost" type="button" disabled title="Publicar" aria-label="Publicar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="grid-overlay" id="gridOverlay">
    <div class="grid-panel">
      <div class="grid-header">
        <span class="grid-title">Galeria</span>
        <button class="grid-close" id="gridClose" type="button" aria-label="Fechar">&times;</button>
      </div>
      <div class="grid-thumbs" id="gridThumbs"></div>
    </div>
  </div>

  <div class="feed-create" id="feedCreate">
    <div class="feed-create-inner">
      <img class="feed-create-avatar" id="feedCreateAvatar" src="/static/svg/default-avatar.svg" alt="">
      <div class="feed-create-main">
        <textarea class="feed-create-input" id="feedCreateText" placeholder="No que você esta pensando?" rows="1" autocomplete="off"></textarea>
        <div class="feed-create-toolbar">
          <input type="file" id="feedCreateFile" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>
          <input type="file" id="feedCreateZip" accept=".zip,application/zip" hidden>
          <button class="feed-create-icon" id="feedCreateEleicaoBtn" type="button" title="Marcar como Eleição" aria-label="Marcar como Eleição">
            <svg width="30" height="15" viewBox="0 2 32 16" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5 2h22c2.761 0 5 2.239 5 5v6c0 2.761-2.239 5-5 5H5c-2.761 0-5-2.239-5-5V7c0-2.761 2.239-5 5-5Zm0 2C3.343 4 2 5.343 2 7v6c0 1.657 1.343 3 3 3h22c1.657 0 3-1.343 3-3V7c0-1.657-1.343-3-3-3H5Z"/>
              <path d="M4.5 7h1.5l1 4.1L8 7h1.5l-1.6 6H6.1L4.5 7Z"/>
              <path fill-rule="evenodd" d="M10.5 7h2c.828 0 1.5.672 1.5 1.5v3c0 .828-.672 1.5-1.5 1.5h-2c-.828 0-1.5-.672-1.5-1.5v-3c0-.828.672-1.5 1.5-1.5Zm0 1.3v3.4h1.4V8.3h-1.4Z"/>
              <path d="M14.5 7h4v1.3h-1.3V13h-1.4V8.3h-1.3V7Z"/>
              <path d="M19 7h3.3v1.3h-1.9v1h1.6v1.3h-1.6v1.1h1.9V13H19V7Z"/>
              <path d="M24.8 8.5h1.3v1.1h1.1v1.3h-1.1V12h-1.3v-1.1h-1.1V9.6h1.1V8.5Z"/>
            </svg>
          </button>
          <div class="feed-create-divider"></div>
          <button class="feed-create-icon" id="feedCreateNsfwBtn" type="button" title="Marcar como NSFW" aria-label="Marcar como NSFW">
            <svg width="20" height="21" viewBox="452 29.333 1133.333 1078.667" aria-hidden="true"><path fill="currentColor" d="M 540.225 140.346 C 545.508 139.898 552.392 139.858 557.708 139.842 L 972.783 139.809 L 1109.66 139.855 C 1131.88 139.877 1155.47 138.317 1177.5 140.267 C 1183.26 140.776 1189.25 142.757 1193.36 146.995 C 1198.23 152.007 1199.46 159.133 1199.4 165.871 C 1199.3 177.476 1194.46 186.536 1183.06 190.341 C 1168.04 195.35 1083.42 192.654 1061.64 192.68 L 707.136 192.984 L 600.103 192.901 C 582.503 192.869 564.556 192.55 547.105 193.151 C 537.206 194.231 528.662 203.113 528.514 212.847 C 528.052 243.182 528.251 273.445 528.211 303.72 L 528.243 490.286 L 527.933 1015.55 C 528.999 1017.47 530.605 1019.93 531.922 1021.68 C 535.678 1026.61 541.235 1029.84 547.376 1030.68 C 554.607 1031.63 571.413 1031.25 579.304 1031.25 L 636.419 1031.24 L 833.327 1031.26 L 1219.39 1031.22 C 1284.66 1031.2 1349.91 1031.23 1415.21 1031.03 C 1438.4 1030.96 1438.55 1016.33 1438.66 997.277 C 1438.7 991.02 1438.6 984.528 1438.65 978.263 L 1439.21 911.25 L 1439.44 555.126 C 1439.62 529.374 1439.64 503.62 1439.51 477.868 C 1439.43 468.653 1438.48 450.689 1438.89 442.343 C 1439.07 438.843 1439.83 435.399 1441.16 432.156 C 1451.96 405.854 1488.56 416.936 1490.12 428.769 C 1493.78 456.396 1492.25 521.532 1492.26 547.233 L 1492.21 837.848 L 1492.26 954.854 C 1492.31 975.57 1492.85 997.002 1492.07 1017.51 C 1490.5 1040 1480.42 1058.67 1461.99 1071.49 C 1439.6 1087.08 1418.02 1085.37 1392.28 1085.42 L 1338.27 1085.46 L 1138.59 1085.63 L 743.476 1085.27 L 614.308 1085.24 C 581.742 1085.26 533.682 1090.42 506.668 1072.54 C 490.873 1061.98 480.013 1045.48 476.554 1026.8 C 473.813 1012.76 474.985 956.524 474.89 938.415 L 474.764 716.348 L 474.492 373.209 L 474.658 268.493 C 474.665 210.998 466.437 153.921 540.225 140.346 z"></path><path fill="currentColor" d="M 587.6 499.532 L 640.487 499.769 L 704.697 648.041 C 705.46 631.836 704.741 615.233 704.744 598.944 C 704.973 565.893 704.855 5           </button>
          <div class="feed-create-divider"></div>
          <button class="feed-create-icon" id="feedCreateZipBtn" type="button" title="Enviar ZIP" aria-label="Enviar ZIP">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18 22H4c-1.103 0-2-.897-2-2V4c0-1.103.897-2 2-2h9.414L20 8.586V20c0 1.103-.897 2-2 2ZM4 4v16h14V9h-6V4H4Zm10 0v3h3l-3-3Z"/>
              <path d="M5 10h4.5v1.3L7 14h2.5v1.5H5v-1.3l2.5-2.7H5V10Z"/>
              <path d="M10.5 10H12v5.5h-1.5V10Z"/>
              <path d="M13 10h2.7c1.2 0 1.8.7 1.8 1.8s-.6 1.8-1.8 1.8h-1.2v1.9H13V10Zm1.5 1.3v1h1c.3 0 .5-.2.5-.5s-.2-.5-.5-.5h-1Z"/>
              <path d="M11 17h2v1h-2v-1Zm0 1.5h2v1h-2v-1Zm0 1.5h2v1h-2v-1Z"/>
            </svg>
          </button>
          <div class="feed-create-divider"></div>
          <button class="feed-create-icon" id="feedCreateImg" type="button" title="Mídia" aria-label="Adicionar mídia">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M18 20H4V6h9V4H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-9h-2v9zm-7.79-3.17l-1.96-2.36L5.5 18h11l-3.54-4.71zM20 4V1h-2v3h-3c.01.01 0 2 0 2h3v2.99c.01.01 2 0 2 0V6h3V4h-3z"></path></svg>
          </button>
          <button class="feed-create-send" id="feedCreateSend" type="button" title="Publicar" aria-label="Publicar" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="feed-create-zip" id="feedCreateZipPreview" hidden>
      <img class="feed-create-zip-icon" src="/static/png/rar.webp" alt="" width="20" height="20">
      <div class="feed-create-zip-info">
        <span class="feed-create-zip-name" id="feedCreateZipLabel">Arquivo ZIP selecionado</span>
        <span class="feed-create-zip-size" id="feedCreateZipSize"></span>
      </div>
      <button class="feed-create-zip-remove" id="feedCreateZipRemove" type="button" aria-label="Remover arquivo">&times;</button>
    </div>
    <div class="feed-create-previews" id="feedCreatePreviews"></div>
  </div>

  <div class="feed-view" id="feedView"></div>

  <div class="feed-nav" id="feedNav">
    <button class="feed-nav-btn" id="feedNavUp" type="button" aria-label="Post anterior">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button class="feed-nav-btn" id="feedNavDown" type="button" aria-label="Próximo post">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-header">
      <div class="lightbox-info">
        <img class="lightbox-avatar" id="lightboxAvatar" src="/static/svg/default-avatar.svg" alt="">
        <span class="lightbox-owner" id="lightboxOwner"></span>
        <span class="lightbox-likes" id="lightboxLikes"></span>
      </div>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fechar">&times;</button>
    </div>
    <div class="lightbox-body" id="lightboxBody">
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Anterior">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="lightbox-img-wrap" id="lightboxImgWrap">
        <img class="lightbox-img" id="lightboxImg" src="" alt="">
      </div>
      <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Próximo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <div class="confirm-overlay" id="confirmModal">
    <div class="confirm-card">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button id="confirmNo" class="confirm-btn">Não</button>
        <button id="confirmYes" class="confirm-btn danger">Excluir</button>
      </div>
    </div>
  </div>

<script src="/static/js/carousel.js"></script>
