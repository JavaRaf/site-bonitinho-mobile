<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — ArteBonitinha</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="/static/svg/logo.svg" alt="logo">
      </div>
      <h1>ArteBonitinha</h1>
      <p>Crie sua conta para interagir</p>
    </div>

    <form id="registerForm" class="auth-form">
      <div class="field">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="escolha um nome" autocomplete="username" required minlength="3">
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="mínimo 4 caracteres" autocomplete="new-password" required minlength="4">
      </div>

      <button type="submit" class="auth-btn">Criar conta</button>

      <p class="auth-error" id="authError"></p>
    </form>

    <p class="auth-switch">
      Já tem conta? <a href="/login">Entrar</a>
    </p>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
