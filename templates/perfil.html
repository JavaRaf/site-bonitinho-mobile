<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil — ArteBonitinha</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/perfil.css">
  <script src="/static/js/theme.js"></script>
</head>

<body>

  <main class="profile-page" id="profilePage">

    <!-- Top Bar -->
    <nav class="topbar" aria-label="Barra do perfil">
      <button class="topbar-btn" id="btnBack" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <div class="topbar-identity">
        <h2 class="topbar-name" id="topbarName"></h2>
        <p class="topbar-count" id="topbarCount"></p>
      </div>
    </nav>

    <!-- Cover -->
    <section class="cover" id="coverSection">
      <img class="cover-img" id="coverImg" src="" alt="Capa">
      <div class="cover-fallback" id="coverFallback"></div>
      <button class="cover-btn" id="btnCoverEdit" hidden aria-label="Editar capa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input type="file" id="coverFileInput" accept="image/*" hidden>
    </section>

    <!-- Profile Header -->
    <section class="profile-header" id="profileCard">

      <div class="header-top">
        <div class="avatar-area">
          <div class="avatar" id="avatarEl">
            <img id="avatarImg" src="/static/svg/default-avatar.svg" alt="Avatar">
          </div>
          <button class="avatar-edit" id="btnAvatarEdit" hidden aria-label="Editar avatar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <input type="file" id="avatarFileInput" accept="image/*" hidden>
        </div>

        <div class="header-actions">
          <div class="action-buttons" id="actionButtons"></div>
          <button class="edit-pill" id="btnEdit" hidden>Editar perfil</button>
        </div>
      </div>

      <div class="identity">
        <h1 class="profile-name" id="profileName"></h1>
        <p class="profile-handle" id="profileHandle"></p>
      </div>

      <p class="profile-bio" id="profileBio" hidden></p>

      <div class="details-list" id="detailsList"></div>

      <p class="profile-stats" id="profileStats"></p>

    </section>

    <!-- Tabs -->
    <nav class="profile-tabs" id="profileTabs" role="tablist" aria-label="Abas do perfil">
      <button class="tab active" role="tab" data-tab="all" aria-selected="true">Posts</button>
      <button class="tab" role="tab" data-tab="photos" aria-selected="false">Fotos</button>
      <button class="tab" id="tabBlocked" role="tab" data-tab="blocked" aria-selected="false" hidden>Bloqueados</button>
    </nav>

    <!-- Posts Grid -->
    <section class="posts-section" id="postsSection">
      <div class="posts-grid" id="postsGrid"></div>
      <div class="posts-loading" id="postsLoading" hidden>Carregando...</div>
      <div class="posts-end" id="postsEnd" hidden>Nenhum post encontrado</div>
    </section>

    <div class="feed-nav" id="feedNav">
      <button class="feed-nav-btn" id="feedNavUp" type="button" aria-label="Post anterior">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="feed-nav-btn" id="feedNavDown" type="button" aria-label="Próximo post">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <!-- Edit Profile Modal -->
    <div class="edit-overlay" id="editOverlay">
      <div class="edit-card">
        <div class="edit-header">
          <h3>Editar perfil</h3>
          <button class="edit-close" id="editClose" aria-label="Fechar">&times;</button>
        </div>
        <div class="edit-body">
          <div class="edit-field">
            <label for="editUsername">Nome de usuário</label>
            <input type="text" id="editUsername" minlength="3" autocomplete="off">
          </div>
          <div class="edit-field">
            <label for="editBio">Bio <span id="bioCounter">0/110</span></label>
            <textarea id="editBio" maxlength="110" rows="3"></textarea>
          </div>
          <div class="edit-field">
            <label for="editLocation">Localização</label>
            <input type="text" id="editLocation" placeholder="Ex: São Paulo, SP" autocomplete="off">
          </div>
          <div class="edit-field">
            <label for="editBirthday">Data de nascimento</label>
            <input type="date" id="editBirthday">
          </div>
          <div class="edit-field">
            <label for="editMarital">Estado civil</label>
            <select id="editMarital">
              <option value="">Não informado</option>
              <option value="Solteiro(a)">Solteiro(a)</option>
              <option value="Namorando">Namorando</option>
              <option value="Noivo(a)">Noivo(a)</option>
              <option value="Casado(a)">Casado(a)</option>
              <option value="Divorciado(a)">Divorciado(a)</option>
              <option value="Viúvo(a)">Viúvo(a)</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="edit-field">
            <label>Cor do nome</label>
            <div class="edit-colors" id="editColors"></div>
          </div>
        </div>
        <div class="edit-footer">
          <button class="edit-cancel" id="editCancel">Cancelar</button>
          <button class="edit-save" id="editSave">Salvar</button>
        </div>
      </div>
    </div>

    <!-- Avatar Crop -->
    <div class="crop-overlay" id="cropOverlay">
      <div class="crop-card">
        <div class="crop-header">
          <h3>Ajustar avatar</h3>
          <button class="crop-close" id="cropClose" type="button" aria-label="Fechar">&times;</button>
        </div>
        <div class="crop-area" id="cropArea">
          <canvas id="cropCanvas"></canvas>
        </div>
        <p class="crop-hint">Arraste para posicionar · Pinça ou scroll para zoom</p>
        <div class="crop-actions">
          <button class="crop-cancel" id="cropCancel" type="button">Cancelar</button>
          <button class="crop-confirm" id="cropConfirm" type="button">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Cover Crop -->
    <div class="crop-overlay" id="coverCropOverlay">
      <div class="crop-card">
        <div class="crop-header">
          <h3>Ajustar capa</h3>
          <button class="crop-close" id="coverCropClose" type="button" aria-label="Fechar">&times;</button>
        </div>
        <div class="crop-area crop-area-cover" id="coverCropArea">
          <canvas id="coverCropCanvas"></canvas>
        </div>
        <p class="crop-hint">Arraste para posicionar · Pinça ou scroll para zoom</p>
        <div class="crop-actions">
          <button class="crop-cancel" id="coverCropCancel" type="button">Cancelar</button>
          <button class="crop-confirm" id="coverCropConfirm" type="button">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Followers / Following List -->
    <div class="list-overlay" id="listOverlay">
      <div class="list-card">
        <div class="list-header">
          <h3 id="listTitle"></h3>
          <button class="list-close" id="listClose" aria-label="Fechar">&times;</button>
        </div>
        <div class="list-body" id="listBody"></div>
      </div>
    </div>

    <!-- Bio Actions -->
    <div class="list-overlay" id="bioOverlay">
      <div class="list-card">
        <div class="list-header">
          <h3>Bio</h3>
          <button class="list-close" id="bioClose" aria-label="Fechar">&times;</button>
        </div>
        <div class="bio-actions">
          <button class="bio-action-btn" id="bioEdit">Editar</button>
          <button class="bio-action-btn danger" id="bioDelete">Excluir</button>
        </div>
      </div>
    </div>

  </main>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-header">
      <div class="lightbox-info">
        <img class="lightbox-avatar" id="lightboxAvatar" src="/static/svg/default-avatar.svg" alt="">
        <span class="lightbox-owner" id="lightboxOwner"></span>
        <span class="lightbox-likes" id="lightboxLikes"></span>
      </div>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fechar">&times;</button>
    </div>
    <div class="lightbox-body" id="lightboxBody">
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Anterior">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="lightbox-img-wrap" id="lightboxImgWrap">
        <img class="lightbox-img" id="lightboxImg" src="" alt="">
      </div>
      <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Próximo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <div class="confirm-overlay" id="confirmModal">
    <div class="confirm-card">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button id="confirmNo" class="confirm-btn">Não</button>
        <button id="confirmYes" class="confirm-btn danger">Excluir</button>
      </div>
    </div>
  </div>

  <script src="/static/js/carousel.js"></script>
  <script src="/static/js/comments.js"></script>
  <script src="/static/js/video-player.js"></script>
  <script src="/static/js/lightbox.js"></script>
  <script src="/static/js/perfil.js"></script>
</body>

</html>
