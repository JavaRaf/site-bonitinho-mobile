<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil — ArteBonitinha</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/perfil.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="perfil-page">

  <div class="perfil-card">
    <div class="perfil-header">
      <a href="/" class="perfil-back"><img src="/static/svg/back.svg" alt="voltar" class="back-icon"></a>
      <h2>Meu Perfil</h2>
      <div class="perfil-header-spacer"></div>
    </div>

    <div class="perfil-avatar-section">
      <div class="perfil-avatar-wrap">
        <div class="perfil-avatar" id="perfilAvatar">
          <img src="/static/svg/default-avatar.svg" alt="avatar" id="perfilAvatarImg">
        </div>
        <button type="button" class="perfil-avatar-edit" id="perfilAvatarMenuBtn" aria-label="Alterar avatar">
          <img src="/static/svg/camera-svgrepo-com.svg" alt="câmera">
        </button>
        <div class="perfil-avatar-menu" id="perfilAvatarMenu" hidden>
          <button type="button" id="perfilAvatarUpload" class="perfil-avatar-menu-item">Escolher imagem</button>
          <button type="button" id="perfilAvatarRemove" class="perfil-avatar-menu-item danger">Remover</button>
        </div>
      </div>
      <p class="perfil-label">Envie sua foto de perfil</p>
      <input type="file" id="perfilAvatarInput" accept="image/*" hidden>
    </div>

    <div class="perfil-section">
      <button type="button" class="perfil-section-toggle" id="perfilColorToggle">
        <p class="perfil-section-title">Cor do seu nome</p>
        <img src="/static/svg/arrow-down.svg" alt="" class="perfil-section-arrow">
      </button>
      <div class="perfil-color-list" id="perfilColorList"></div>
    </div>

    <div class="perfil-field">
      <label for="perfilUsername">Nome de usuário</label>
      <input type="text" id="perfilUsername" minlength="3" autocomplete="off" placeholder="Seu nome de exibição">
    </div>

    <div class="perfil-field">
      <label for="perfilBirthday">Data de nascimento</label>
      <input type="date" id="perfilBirthday">
    </div>

    <button id="perfilSave" class="perfil-btn">Salvar alterações</button>
    <p class="perfil-error" id="perfilError"></p>
    <p class="perfil-ok" id="perfilOk"></p>
  </div>

  <script src="/static/js/perfil.js"></script>
</body>
</html>
