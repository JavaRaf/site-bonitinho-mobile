<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#FA8128">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MikanNet">
  <link rel="apple-touch-icon" href="/static/png/logo-128x128.png">
  <link rel="icon" href="/static/png/logo-128x128.png">
  <title>Eleição — MikanNet</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/votos.css">
  <link rel="stylesheet" href="/static/css/modals.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="votos-page">

  <div class="votos-header">
    <a href="/" class="votos-back"><svg class="back-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></a>
    <h2>Eleição</h2>
  </div>

  <div class="votos-tabs">
    <button class="votos-tab active" data-tab="ranking">Ranking</button>
    <button class="votos-tab" data-tab="vencedoras">Vencedoras</button>
  </div>

  <div id="tabRanking">
    <div class="votos-list" id="votosList"></div>
  </div>

  <div id="tabVencedoras" style="display:none">
    <div class="votos-tab-header">
      <button class="votos-add-winner" id="addWinnerBtn" style="display:none" title="Adicionar vencedora">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>
    <div class="votos-list" id="vencedorasList"></div>
  </div>

  <div class="winner-modal-overlay" id="winnerModal">
    <div class="winner-modal-card">
      <h3>Adicionar Vencedora</h3>
      <div class="winner-modal-upload" id="winnerUpload">
        <input type="file" id="winnerFileInput" accept="image/*" hidden>
        <div class="winner-modal-preview" id="winnerPreview">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>Carregar imagem</span>
        </div>
      </div>
      <div class="winner-modal-fields">
        <label class="winner-modal-label">
          <span>Legenda</span>
          <textarea id="winnerCaption" class="winner-modal-input" placeholder="Opcional" maxlength="200" rows="3"></textarea>
        </label>
        <label class="winner-modal-label">
          <span>Número</span>
          <input type="text" id="winnerNumber" class="winner-modal-input" placeholder="Ex: 0001" maxlength="10">
        </label>
        <label class="winner-modal-label">
          <span>Data</span>
          <input type="date" id="winnerDate" class="winner-modal-input">
        </label>
      </div>
      <div class="winner-modal-actions">
        <button id="winnerCancel" class="winner-modal-btn secondary">Cancelar</button>
        <button id="winnerConfirm" class="winner-modal-btn primary">Salvar</button>
      </div>
    </div>
  </div>

  <script src="/static/js/modals.js"></script>
  <script src="/static/js/votos.js"></script>
</body>
</html>
